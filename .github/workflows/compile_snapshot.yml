name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['21', '25']
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: maven

      - name: Build and test with Maven
        run: mvn -B -U clean verify -s ci_settings.xml

      - name: Test configuration migration tool
        run: mvn -B -ntp -f tools/config-migrator/pom.xml -Dmaven.compiler.fork=true clean verify

      - name: Verify plugin jar
        shell: bash
        run: |
          set -euo pipefail
          version="$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)"
          plugin_path="bedwars-plugin/target/SimpMC-BW1.8.8-${version}.jar"
          test -f "$plugin_path"
          grep -Fx "version: ${version}" < <(unzip -p "$plugin_path" plugin.yml)
          grep -Fx "main: com.andrei1058.bedwars.BedWars" < <(unzip -p "$plugin_path" plugin.yml)

      - name: Upload plugin jar
        if: matrix.java == '25'
        uses: actions/upload-artifact@v4
        with:
          name: SimpMC-BW1.8.8-plugin
          path: |
            bedwars-plugin/target/SimpMC-BW1.8.8-*.jar
            !bedwars-plugin/target/original-*.jar
          if-no-files-found: error
