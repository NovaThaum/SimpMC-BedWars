name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 配置 JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build and test with Maven
        run: mvn -B -U clean verify -s ci_settings.xml

      - name: Test configuration migration tool
        run: mvn -B -ntp -f tools/config-migrator/pom.xml -Dmaven.compiler.fork=true clean verify

      - name: Verify plugin jar
        shell: bash
        run: |
          set -euo pipefail
          version="$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)"
          plugin_path="bedwars-plugin/target/SimpMC-BW1.8.8-${version}.jar"
          test -f "$plugin_path"
          grep -Fx "version: ${version}" < <(unzip -p "$plugin_path" plugin.yml)
          grep -Fx "main: com.andrei1058.bedwars.BedWars" < <(unzip -p "$plugin_path" plugin.yml)
          entries="$(unzip -Z1 "$plugin_path")"
          grep -Fx 'com/andrei1058/bedwars/api/messages/ChineseMessages.class' <<< "$entries"
          if grep -E '^com/andrei1058/bedwars/(api/)?language/|PlayerLangChangeEvent\.class$|messages_(en|fr|de|es|ru)' <<< "$entries"; then
            echo '发布包不得包含旧 i18n 类或外语消息资源'
            exit 1
          fi

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: SimpMC-BW1.8.8-plugin
          path: |
            bedwars-plugin/target/SimpMC-BW1.8.8-*.jar
            !bedwars-plugin/target/original-*.jar
          if-no-files-found: error
